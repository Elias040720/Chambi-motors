name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chambi
          POSTGRES_PASSWORD: chambi_local_dev
          POSTGRES_DB: chambi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chambi -d chambi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://chambi:chambi_local_dev@localhost:5432/chambi
      LOCAL_AUTH_STUB: "true"
      ADMIN_PASSWORD: ci-local-password-only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:rls
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm --filter @chambi/mobile exec expo install --check
      - run: pnpm --filter @chambi/mobile exec expo export --platform android
      - run: pnpm build
